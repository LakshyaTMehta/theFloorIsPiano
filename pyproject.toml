[project]
name = "theFloorIsPiano"
version = "0.1.0"
description = "a python script that lets you define quadrilateral zones on any camera feed and turn them into piano keys for you to step on and play :)."
readme = "README.md"
authors = [
    { name = "LakshyaMehta", email = "lakshya.t.mehta@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mediapipe>=1.1.1",
    "opencv-python>=5.0.0.93",
    "pygame-ce>=2.5.8",
]

[project.scripts]
thefloorispiano = "thefloorispiano.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
